version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__MAX_REQUEST_SIZE_MB=128
    volumes:
      - ./qdrant_storage:/qdrant/storage
      - ./qdrant_config:/qdrant/config
    restart: always

  minio:
    image: minio/minio:latest
    container_name: minio-server
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - ./minio_data:/data
    command: server --console-address ":9001" /data
    restart: unless-stopped

  # Служебный контейнер для автоматической настройки MinIO
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadminpassword) do echo 'Waiting for MinIO...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing myminio/rag-images;
      /usr/bin/mc anonymous set download myminio/rag-images;
      echo 'Bucket rag-images created and set to public download successfully!';
      exit 0;
      "

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - minio
      - mcp
    restart: always

  mcp:
    build: .
    environment:
      QDRANT_HOST: qdrant
      MINIO_PUBLIC_URL: http://phoenix.lan/images
      HF_HOME: /cache/huggingface
    volumes:
      - hf_models_cache:/cache/huggingface
    command: python3 mcp_server.py
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              device_ids: ['nvidia.com/gpu=all']
              capabilities: [gpu]
volumes:
  hf_models_cache:
