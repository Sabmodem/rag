events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # 1. Проксирование картинок из MinIO
        location /images/ {
            proxy_pass http://minio-server:9000/rag-images/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }


        # 2. Проксирование MCP сервера
        location / {
            # Убираем косую черту на конце, чтобы NGINX передавал пути "как есть"
            proxy_pass http://mcp:8000; 
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Настройка заголовков соединения для SSE
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            
            # Изменяем на явный bypass, чтобы NGINX не ломал POST-запросы после GET
            proxy_set_header Connection $http_connection; 
            
            # Отключаем буферизацию
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

    }
}
